version: 1.10.0
server:
  port: 1991
spring:
  application:
    name: survey
  profiles:
    active: dev # maven 配置   原来是 @activeProfile@，改成 dev
#    active: ${activeProfile} # gradle 配置
  mvc:
    async:
      request-timeout: -1
    static-path-pattern: /notfound # 覆盖默认的 /**
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
  jackson:
    default-property-inclusion: non_null # 序列化忽略空值
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false # 反序列化时允许未知属性
sk:
  security:
    url-token-authentication:
      enabled: true # 默认开启 url token 认证
flowable:
  async-executor-activate: false
  database-schema-update: false

aj:
  captcha:
    jigsaw: classpath:images/jigsaw # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    pic-click: classpath:images/pic-click # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    cache-type: local # 缓存 local/redis...
    cache-number: 1000 # local 缓存的阈值,达到这个值，清除缓存
    timing-clear: 180 # local定时清除过期缓存(单位秒),设置为0代表不执行
    type: blockPuzzle # 验证码类型 default两种都实例化。 blockPuzzle 滑块拼图 clickWord 文字点选
    water-mark: survey # 右下角水印文字(我的水印)，可使用 https://tool.chinaz.com/tools/unicode.aspx 中文转 Unicode，Linux 可能需要转 unicode
    interference-options: 2 # 滑动干扰项(0/1/2)
    req-frequency-limit-enable: false # 接口请求次数一分钟限制是否开启 true|false
    req-get-lock-limit: 5 # 验证失败5次，get接口锁定
    req-get-lock-seconds: 10 # 验证失败后，锁定时间间隔
    req-get-minute-limit: 30 # get 接口一分钟内请求数限制
    req-check-minute-limit: 60 # check 接口一分钟内请求数限制
    req-verify-minute-limit: 60 # verify 接口一分钟内请求数限制

api:
  prefix: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.boot.web.embedded.undertow: INFO

wisestar:
  ai:
    siliconflow:
      enabled: true
      base-url: https://api.siliconflow.cn
      token: ${AI_SILICONFLOW_TOKEN:your_token}
      model-id: deepseek-chat
      model-types:
        - display-name: "DeepSeek Chat"
          value: "deepseek-chat"
          description: "DeepSeek 对话模型"
        - display-name: "Qwen2.5-72B-Instruct"
          value: "Qwen/Qwen2.5-72B-Instruct"
          description: "Qwen2.5 72B 指令模型"
        - display-name: "Llama-3.1-70B-Instruct"
          value: "meta-llama/Meta-Llama-3.1-70B-Instruct"
          description: "Llama 3.1 70B 指令模型"
# 英语朗读音频（服务端合成）：学员设备常见缺少英文语音包，由服务端合成并缓存
english:
  tts:
    engine: piper  # piper=本地神经语音（推荐）/ espeak=本地 espeak-ng / none=关闭（前端退回浏览器语音合成）
    fallback-engine: espeak  # 主引擎不可用或单句失败时的回退，空表示不回退
    piper-bin: ${ENGLISH_TTS_PIPER_BIN:/opt/wisestar-tts/venv/bin/piper}
    piper-voice: ${ENGLISH_TTS_PIPER_VOICE:/opt/wisestar-tts/voices/en_GB-jenny_dioco-medium.onnx}  # 英式女声（小学课堂带读口径）
    espeak-bin: espeak-ng
    lame-bin: lame  # 缺失时直接返回 wav
    voice: en-gb  # espeak-ng 回退音色，与 Piper 音色保持同一口音
    speed: 109  # espeak 词/分口径；109 ≈ 常速的 0.75 倍（小学课件慢速朗读），调大更快
    max-chars: 240
    cache-dir: ${ENGLISH_TTS_CACHE_DIR:}
    timeout-seconds: 30
    warmup-threads: 2
    daemon: true  # 常驻 Piper 进程：模型只加载一次，单句约 60ms；关闭后每句冷合成约 1.7s
    daemon-max: 1  # 常驻进程上限（每个约 170MB 内存）；内存宽裕可调到 2 让课文语速也常驻
    daemon-idle-seconds: 600  # 闲置多久回收常驻进程
    preload-speeds: 125  # 启动时预热的语速：单词练习 125（课文 109 走整篇批量预热，不占常驻进程）

# AI 服务配置
ai:
  tts:
    enabled: false  # 是否启用 TTS 语音生成
    api-url: https://api.openai.com/v1/audio/speech  # TTS API 地址
    api-key: YOUR_TTS_API_KEY  # TTS API Key
  image:
    enabled: false  # 是否启用 DALL-E 图片生成
    api-url: https://api.openai.com/v1/images/generations  # DALL-E API 地址
    api-key: YOUR_IMAGE_API_KEY  # DALL-E API Key
  text:
    enabled: false  # 是否启用 GPT 文本生成
    api-url: https://api.openai.com/v1/chat/completions  # GPT API 地址
    api-key: YOUR_TEXT_API_KEY  # GPT API Key

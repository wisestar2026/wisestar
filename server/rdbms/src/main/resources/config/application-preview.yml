# 预览环境配置：H2 文件数据库
# 用于在线预览环境，无需安装 MySQL
spring:
  datasource:
    username: sa
    password:
    url: jdbc:h2:file:./wisestar;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:scripts/init-h2.sql
      data-locations: classpath:scripts/data-h2.sql
      continue-on-error: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    call-setters-on-nulls: false
  global-config:
    db-config:
      logic-delete-field: deleted

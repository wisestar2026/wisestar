# 单域名路径反代：一套证书同时承载 AI 自习室与教研平台
# 注意：/open/research/ 只在回环地址暴露，禁止在此转发到公网

server {
    listen 80;
    server_name research.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name research.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 教研后端（必须放在 /research/ 之前）
    location /research/api/ {
        proxy_pass http://127.0.0.1:7010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 教研前端（VITE_BASE_PATH=/research/）
    location /research/ {
        alias /srv/wisestar/research/client/dist/;
        try_files $uri $uri/ /research/index.html;
    }

    # AI 自习室
    location /api/ {
        proxy_pass http://127.0.0.1:1991/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /srv/wisestar/client/dist;
        try_files $uri /index.html;
    }
}
